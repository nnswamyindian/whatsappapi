version: '3.8'

services:
  # MetaGreenWave Production Application Server
  metagreenwave-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: metagreenwave:latest
    container_name: metagreenwave-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=mysql://greenwave:GreenWave%232025@mysql:3306/greenwave_db
      - DB_ENGINE=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=greenwave_db
      - DB_USER=greenwave
      - DB_PASSWORD=GreenWave#2025
      - JWT_SECRET=production_jwt_secret_change_me_to_a_secure_random_string_32
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - APP_URL=http://localhost:5000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - metagreenwave-net
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  # MySQL 8.0 Enterprise Relational Database
  mysql:
    image: mysql:8.0
    container_name: metagreenwave-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=300
      --innodb_buffer_pool_size=512M
    environment:
      MYSQL_ROOT_PASSWORD: root_production_password_2025
      MYSQL_DATABASE: greenwave_db
      MYSQL_USER: greenwave
      MYSQL_PASSWORD: GreenWave#2025
    ports:
      - "3306:3306"
    volumes:
      - metagreenwave_mysql_data:/var/lib/mysql
      - ./scripts/setup-mysql.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "greenwave", "-pGreenWave#2025"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - metagreenwave-net

volumes:
  metagreenwave_mysql_data:
    name: metagreenwave_mysql_data

networks:
  metagreenwave-net:
    name: metagreenwave-net

