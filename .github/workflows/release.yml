name: MetaGreenWave Release & Versioning

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release & Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Build Production Assets
        run: |
          npm ci || npm install
          cd client && (npm ci || npm install) && npm run build
          cd ../server && (npm ci || npm install) && npm run build

      - name: Package Release Bundle (ZIP)
        run: |
          mkdir -p release-bundle
          cp -r server/dist release-bundle/server
          cp -r client/dist release-bundle/client
          cp package.json release-bundle/
          cp server/package.json release-bundle/server/
          cp docker-compose.prod.yml release-bundle/docker-compose.yml 2>/dev/null || true
          tar -czf metagreenwave-${{ github.ref_name }}.tar.gz release-bundle/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MetaGreenWave Enterprise ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            metagreenwave-${{ github.ref_name }}.tar.gz
          body: |
            ## MetaGreenWave Enterprise WhatsApp Business Messaging SaaS
            
            ### Release Notes (${{ github.ref_name }})
            - **Platform Name:** MetaGreenWave
            - **WhatsApp API:** Official Meta WhatsApp Cloud API v21.0
            - **Database:** Dual-Engine MySQL 8.0+ Enterprise Pool with SQLite WAL automatic fallback
            - **Omnichannel Follow-ups:** Automated WhatsApp + Email notifications across registration, approval, payment, nurture playbooks, festival wishes, and win-back renewals.
            - **Security:** AES-256-GCM credential encryption, RBAC, suppression list compliance.

