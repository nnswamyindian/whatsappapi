name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || secrets.HOST }}
          VPS_USER: ${{ secrets.VPS_USER || secrets.USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/metagreenwave' }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_KEY" ]; then
            echo "❌ Missing required secrets: VPS_HOST, VPS_USER, or VPS_SSH_KEY."
            echo "Please set them in GitHub: Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "🚀 Connecting to $VPS_USER@$VPS_HOST:$DEPLOY_PATH on port $VPS_PORT..."
          mkdir -p ~/.ssh
          echo "$VPS_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/id_rsa -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" << 'EOF'
            set -e
            echo "=========================================================="
            echo "🟢 UPDATING METAGREENWAVE ON VPS ($DEPLOY_PATH)"
            echo "=========================================================="
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            # 1. Pull latest code from GitHub
            if [ -d ".git" ]; then
              echo "📥 Pulling latest changes from GitHub..."
              git pull origin main
            else
              echo "📥 Cloning repository..."
              git clone https://github.com/nnswamyindian/whatsappapi.git .
            fi

            # 2. Build Client
            echo "📦 Building client..."
            cd client
            npm install
            npm run build
            cd ..

            # 3. Build Server
            echo "📦 Building server..."
            cd server
            npm install
            npm run build
            cd ..

            # 4. Restart Application with PM2 (or node fallback)
            echo "🔄 Restarting application..."
            if command -v pm2 &> /dev/null; then
              pm2 reload ecosystem.config.cjs --env production || pm2 start ecosystem.config.cjs --env production
              pm2 save || true
            else
              pkill -f "node dist/index.js" || true
              sleep 1
              cd server && nohup npm start > ../server.log 2>&1 &
              cd ..
            fi

            # 5. Check Health
            echo "🩺 Verifying healthcheck..."
            sleep 3
            curl -s http://localhost:5000/api/v1/health || true
            echo ""
            echo "🎉 MetaGreenWave deployment complete and live!"
          EOF
