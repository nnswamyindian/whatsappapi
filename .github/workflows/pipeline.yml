name: MetaGreenWave Unified CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop, staging ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop, staging ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production
      run_migrations:
        description: 'Run Database Migrations before deployment'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  # ============================================================================
  # 1. TYPECHECK & LINT GATE
  # ============================================================================
  typecheck:
    name: Typecheck & Code Integrity
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install Client Dependencies
        run: cd client && (npm ci || npm install)

      - name: Install Server Dependencies
        run: cd server && (npm ci || npm install)

      - name: Client TypeScript Check (tsc --noEmit)
        run: cd client && npx tsc --noEmit

      - name: Server TypeScript Check (tsc --noEmit)
        run: cd server && npx tsc --noEmit

  # ============================================================================
  # 2. PRODUCTION ASSET BUILD
  # ============================================================================
  build:
    name: Build Client & Server Assets
    needs: [ typecheck ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          cd client && (npm ci || npm install)
          cd ../server && (npm ci || npm install)

      - name: Build Vite Frontend Bundle
        run: cd client && npm run build

      - name: Build Server Distribution
        run: cd server && npm run build

      - name: Archive Client Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 7

      - name: Archive Server Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: server/dist/
          retention-days: 7

  # ============================================================================
  # 3. AUTOMATED TESTING (Core 22 Suites + Enterprise E2E)
  # ============================================================================
  test:
    name: Core & Enterprise E2E Test Suites
    needs: [ build ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          cd client && (npm ci || npm install)
          cd ../server && (npm ci || npm install)

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist

      - uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: server/dist

      - name: Run Core Backend Unit & Integration Tests (22 Suites)
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_key_minimum_32_characters_long_12345
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PORT: 5000
        run: |
          cd server
          npm test

      - name: Start MetaGreenWave Backend Server Daemon
        env:
          NODE_ENV: test
          PORT: 5000
          JWT_SECRET: ci_test_jwt_secret_key_minimum_32_characters_long_12345
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          cd server
          node dist/index.js &
          echo $! > ../server.pid
          sleep 4

      - name: Healthcheck Verification Probe
        run: |
          curl -f http://localhost:5000/api/v1/health || (echo "Health check probe failed!" && exit 1)

      - name: Run Enterprise E2E Acceptance Test Suite
        run: |
          node server/tests/enterprise-e2e.cjs

      - name: Run Template Media Upload Tests
        run: |
          node server/tests/template-media-test.cjs

      - name: Stop Background Server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi

  # ============================================================================
  # 4. SECURITY & DEPENDENCY AUDIT
  # ============================================================================
  security:
    name: Security & Vulnerability Scan
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Audit Root Dependencies
        run: npm audit --audit-level=high || true

      - name: Audit Server Dependencies
        run: cd server && npm audit --audit-level=high || true

      - name: Audit Client Dependencies
        run: cd client && npm audit --audit-level=high || true

  # ============================================================================
  # 5. DOCKER CONTAINER BUILD & REGISTRY PUBLISH
  # ============================================================================
  docker-publish:
    name: Build & Push Production Docker Image
    needs: [ test, security ]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 6. CONTINUOUS DEPLOYMENT (Automated VPS Delivery via SSH)
  # ============================================================================
  deploy:
    name: Automated VPS Deployment & Health Verification
    needs: [ docker-publish ]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL || 'http://localhost:5000' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check VPS Secrets Configuration
        id: check-secrets
        run: |
          VPS_HOST="${{ secrets.VPS_HOST || secrets.HOST }}"
          VPS_USER="${{ secrets.VPS_USER || secrets.USERNAME }}"
          VPS_KEY="${{ secrets.VPS_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSHKEY }}"
          
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_KEY" ]; then
            echo "has_vps=true" >> $GITHUB_OUTPUT
            echo "✅ VPS deployment secrets detected: Host, User, and SSH Key configured."
          else
            echo "has_vps=false" >> $GITHUB_OUTPUT
            echo "⚠️ Notice: VPS deployment secrets (VPS_HOST, VPS_USER, VPS_SSH_KEY) are not set in GitHub Secrets."
            echo "ℹ️ The pipeline will log deployment instructions until secrets are added in repository settings."
          fi

      - name: Deploy to Remote VPS via SSH
        if: steps.check-secrets.outputs.has_vps == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || secrets.HOST }}
          VPS_USER: ${{ secrets.VPS_USER || secrets.USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSHKEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || vars.VPS_DEPLOY_PATH || '/opt/metagreenwave' }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}:latest
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Initiating Secure SSH Deployment to $VPS_USER@$VPS_HOST:$DEPLOY_PATH (Port: $VPS_PORT)..."
          
          # Setup SSH configuration & Key
          mkdir -p ~/.ssh
          echo "$VPS_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Execute Deployment on Remote VPS
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" bash -s << REMOTE_EOF
            set -e
            echo "=========================================================="
            echo "🟢 REMOTE VPS: Deploying MetaGreenWave Production Release"
            echo "=========================================================="
            
            # Ensure deployment directory exists
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            # Authenticate Docker with GHCR (GitHub Container Registry)
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull the newly built production Docker image
            echo "📥 Pulling latest image: $IMAGE_NAME..."
            docker pull "$IMAGE_NAME"

            # Copy or sync compose files if git repository exists on host, otherwise run docker-compose or container
            if [ -f "$DEPLOY_PATH/docker-compose.prod.yml" ]; then
              echo "🔄 Updating services via docker compose..."
              docker compose -f docker-compose.prod.yml pull metagreenwave-app || true
              docker compose -f docker-compose.prod.yml up -d --remove-orphans
            elif [ -f "$DEPLOY_PATH/docker-compose.yml" ]; then
              echo "🔄 Updating services via docker compose..."
              docker compose pull || true
              docker compose up -d --remove-orphans
            else
              echo "🔄 Rolling out standalone container $IMAGE_NAME..."
              docker stop metagreenwave-app 2>/dev/null || true
              docker rm metagreenwave-app 2>/dev/null || true
              docker run -d \
                --name metagreenwave-app \
                --restart unless-stopped \
                -p 5000:5000 \
                -e NODE_ENV=production \
                -e PORT=5000 \
                "$IMAGE_NAME"
            fi

            # Remote Healthcheck Verification
            echo "🩺 Verifying health probe on remote VPS..."
            sleep 6
            for i in {1..12}; do
              if curl -s -f http://localhost:5000/api/v1/health > /dev/null 2>&1; then
                echo "✅ MetaGreenWave is LIVE and HEALTHY on VPS!"
                break
              fi
              echo "Healthcheck probe attempt \$i/12... waiting 4s"
              sleep 4
            done
            
            # Clean up old unused images
            docker image prune -f >/dev/null 2>&1 || true
            echo "🎉 Deployment completed successfully!"
          REMOTE_EOF

      - name: Simulated Deployment Notice (When VPS Secrets Not Configured)
        if: steps.check-secrets.outputs.has_vps != 'true'
        run: |
          echo "========================================================================="
          echo "ℹ️  VPS DEPLOYMENT READY FOR ACTIVATION"
          echo "========================================================================="
          echo "Image Built and Pushed: ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "Target Environment:     ${{ github.event.inputs.target_env || 'production' }}"
          echo ""
          echo "To enable direct auto-deploy to your VPS on every commit/tag, configure"
          echo "the following in GitHub: Settings -> Secrets and variables -> Actions"
          echo ""
          echo "  Secrets:"
          echo "    - VPS_HOST:        Your VPS IP address or domain (e.g. 194.164.55.12)"
          echo "    - VPS_USER:        SSH username (e.g. root, ubuntu)"
          echo "    - VPS_SSH_KEY:     Private SSH key (PEM / OpenSSH format)"
          echo ""
          echo "  Variables (Optional):"
          echo "    - VPS_PORT:        SSH port (default: 22)"
          echo "    - VPS_DEPLOY_PATH: Directory path on VPS (default: /opt/metagreenwave)"
          echo "    - APP_URL:         Public URL of your platform (e.g. https://app.metagreenwave.com)"
          echo "========================================================================="

  # ============================================================================
  # 7. GITHUB RELEASE & CHANGELOG (For Version Tags)
  # ============================================================================
  release:
    name: Publish GitHub Release
    needs: [ docker-publish ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Build Release Bundle
        run: |
          npm ci || npm install
          cd client && (npm ci || npm install) && npm run build
          cd ../server && (npm ci || npm install) && npm run build
          mkdir -p release-bundle
          cp -r server/dist release-bundle/server
          cp -r client/dist release-bundle/client
          cp package.json release-bundle/
          cp server/package.json release-bundle/server/
          tar -czf metagreenwave-${{ github.ref_name }}.tar.gz release-bundle/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MetaGreenWave Enterprise ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            metagreenwave-${{ github.ref_name }}.tar.gz
          body: |
            ## MetaGreenWave Enterprise WhatsApp Business Messaging SaaS
            
            ### Release Summary (${{ github.ref_name }})
            - **Platform:** MetaGreenWave
            - **WhatsApp Cloud API:** Official Meta Graph API v21.0
            - **CI/CD Pipeline:** Consolidated Single-Workflow Pipeline (`.github/workflows/pipeline.yml`)
            - **Features:** Omnichannel WhatsApp + Email Follow-ups, Dual Provider/Tenant Architecture, Mobile Responsive Layouts, Template Media Uploads (Images, Videos, Documents).

