name: Deploy to VPS

on:
  push:
    branches:
      - main  # your default branch
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          cd client && npm install
          chmod +x node_modules/.bin/* 2>/dev/null || true
          cd ../server && npm install
          chmod +x node_modules/.bin/* 2>/dev/null || true
          cd ..

      - name: Build Project
        run: |
          cd client && npm run build
          cd ../server && npm run build

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH || '/var/www/metagreenwave' }}"
            echo "=========================================================="
            echo "🚀 Updating MetaGreenWave on VPS ($DEPLOY_PATH)..."
            echo "=========================================================="
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            # 1. Pull latest code from GitHub
            if [ -d ".git" ]; then
              echo "📥 Pulling latest git updates..."
              git fetch --all
              git checkout main
              git pull origin main
            else
              echo "📥 Cloning repository..."
              git clone https://github.com/nnswamyindian/whatsappapi.git .
            fi

            # 2. Install dependencies & build on VPS
            echo "📦 Building client and server..."
            cd client && npm install
            chmod +x node_modules/.bin/* 2>/dev/null || true
            npm run build
            cd ../server && npm install
            chmod +x node_modules/.bin/* 2>/dev/null || true
            npm run build
            cd ..

            # 3. Reload application via PM2 or Node
            echo "🔄 Restarting application process..."
            if command -v pm2 &> /dev/null; then
              pm2 reload ecosystem.config.cjs --env production || pm2 start ecosystem.config.cjs --env production
              pm2 save || true
            else
              pkill -f "node dist/index.js" || true
              sleep 1
              cd server && nohup npm start > ../server.log 2>&1 &
              cd ..
            fi

            # 4. Verify local application health
            sleep 3
            curl -s http://localhost:5000/api/v1/health || true
            echo ""
            echo "🎉 MetaGreenWave application updated and running!"

      - name: Restart Nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            if command -v systemctl &> /dev/null && systemctl is-active --quiet nginx; then
              echo "🔄 Restarting Nginx reverse proxy..."
              sudo systemctl restart nginx
              echo "✅ Nginx restarted successfully."
            else
              echo "ℹ️ Nginx service not active or not installed, skipping."
            fi
