version: '3.8'

services:
  # MySQL 8.0 Enterprise Relational Database
  mysql:
    image: mysql:8.0
    container_name: greenwave-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --innodb_buffer_pool_size=256M
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password_2025
      MYSQL_DATABASE: greenwave_db
      MYSQL_USER: greenwave
      MYSQL_PASSWORD: GreenWave#2025
    ports:
      - "3306:3306"
    volumes:
      - greenwave_mysql_data:/var/lib/mysql
      - ./scripts/setup-mysql.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "greenwave", "-pGreenWave#2025"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - greenwave-net

  # phpMyAdmin Web GUI for Database Management & Inspection
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: greenwave-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: greenwave
      PMA_PASSWORD: GreenWave#2025
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - greenwave-net

volumes:
  greenwave_mysql_data:
    name: greenwave_mysql_data

networks:
  greenwave-net:
    name: greenwave-net

